<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>unbind</title>
<meta name="description" content="A tiny satire of brand-and-mood pairing in AI greetings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f6;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e2e0da;
    --accent: #c9552b;
    --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --fg: #ececec;
      --muted: #9a9a9a;
      --line: #2c2c2c;
      --accent: #e8794f;
      --card: #1d1d1d;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: ui-serif, Georgia, "Noto Serif SC", "Songti SC", serif;
    line-height: 1.55;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header, main, footer { width: min(720px, 92vw); margin: 0 auto; }
  header {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 1.5rem 0 0;
  }
  header h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: .04em; margin: 0; }
  .lang { display: flex; gap: .25rem; }
  .lang button {
    font: inherit; font-size: .85rem; background: none; border: 1px solid var(--line);
    color: var(--muted); padding: .2rem .6rem; border-radius: 999px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }

  main { flex: 1; padding: 3rem 0 4rem; }
  .intro { color: var(--muted); font-size: 1rem; max-width: 56ch; }

  .demo { margin-top: 2rem; }
  .tag { color: var(--muted); font-size: .8rem; margin: .6rem 0 0; letter-spacing: .04em; text-align: center; }
  .actions { margin-top: 1.25rem; display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }
  .actions button {
    font: inherit; font-size: .95rem; cursor: pointer;
    padding: .55rem 1.1rem; border-radius: 999px;
    border: 1px solid var(--fg); background: var(--fg); color: var(--bg);
  }
  .actions button.secondary { background: none; color: var(--fg); }
  .actions button:active { transform: translateY(1px); }
  .toast { color: var(--muted); font-size: .85rem; min-height: 1.4em; margin-top: .75rem; text-align: center; }
  .kinds { display: flex; gap: .4rem; justify-content: center; flex-wrap: wrap; margin-top: .5rem; margin-bottom: 1.5rem; }
  .kinds button {
    font: inherit; font-size: .8rem; cursor: pointer; background: none;
    border: 1px solid var(--line); color: var(--muted); padding: .2rem .7rem; border-radius: 999px;
  }
  .kinds button[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }

  section { margin-top: 3.5rem; }
  section.demo { margin-top: 2rem; }
  h2 { font-size: 1.15rem; font-weight: 600; margin: 0 0 .75rem; }
  p { margin: .5rem 0; }
  .shots { display: flex; flex-direction: column; gap: 1.25rem; margin-top: 1rem; }
  figure { margin: 0; }
  figure img {
    display: block; max-width: 100%; height: auto;
    border: 1px solid var(--line); border-radius: 10px;
  }
  figcaption { color: var(--muted); font-size: .85rem; margin-top: .4rem; }
  /* Redrawn "after" card. All measurements are taken from screenshots/claude.png (1884x634)
     and expressed in container-width units so the card scales as one piece. */
  figure.redraw-wrap { container-type: inline-size; }
  figure.shot-wrap { container-type: inline-size; }
  .shot { position: relative; }
  .shot img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 10px; }
  /* Fade the input box in the real screenshot the same way, as an overlay; the image file is untouched. */
  .shot .fade {
    position: absolute; left: 3.6cqw; right: 6.4cqw; top: 15.1cqw; height: 14.5cqw;
    background: rgba(21, 21, 21, .5); backdrop-filter: blur(1px); -webkit-backdrop-filter: blur(1px);
    border-radius: 1.6cqw; pointer-events: none;
  }
  .redraw {
    position: relative;
    aspect-ratio: 1884 / 634;
    background: #151515; color: #f0efec;
    border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden;
    font-family: "Newsreader", ui-serif, Georgia, "Noto Serif SC", "Songti SC", serif;
    font-optical-sizing: auto;
  }
  .redraw .rd-title {
    position: absolute; left: 0; right: 0; top: 6.95cqw;
    transform: translateY(-50%);
    text-align: center;
    font-size: 5.2cqw; line-height: 1; letter-spacing: -0.015em;
    white-space: nowrap;
  }
  .redraw .rd-title em { font-style: normal; }
  .redraw .rd-box {
    position: absolute; left: 4cqw; right: 4cqw; top: 15.45cqw; height: 13.75cqw;
    background: #20201f; border: 1px solid #363635; border-radius: 1.3cqw;
    /* The line is the point; the box is context. Same fade is laid over the real screenshot below. */
    opacity: .5; filter: blur(1px);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  .redraw .rd-ph {
    position: absolute; left: 2.4cqw; top: 3.55cqw; transform: translateY(-50%);
    color: #898782; font-size: 2.1cqw; letter-spacing: -0.01em;
  }
  .redraw .rd-row {
    position: absolute; left: 2.4cqw; right: 2.4cqw; top: 10.4cqw; transform: translateY(-50%);
    display: flex; align-items: center; gap: 1.1cqw; font-size: 1.85cqw;
  }
  .redraw .rd-plus { color: #f0efec; font-size: 2.6cqw; line-height: 1; font-weight: 300; margin-right: .6cqw; }
  .redraw .rd-pills { display: flex; background: #2a2a29; border-radius: 999px; padding: .25cqw; }
  .redraw .rd-pill { padding: .55cqw 1.3cqw; border-radius: 999px; color: #898782; }
  .redraw .rd-pill.on { background: #40403f; color: #f0efec; }
  .redraw .rd-right { margin-left: auto; display: flex; align-items: center; gap: 1.4cqw; color: #c3c2b8; }
  .redraw .rd-right .dim { color: #898782; }
  .redraw .rd-mic { width: 1.1cqw; height: 1.9cqw; border: .16cqw solid #c3c2b8; border-radius: 999px; position: relative; }
  .redraw .rd-mic::after { content: ""; position: absolute; left: -.45cqw; right: -.45cqw; bottom: -.55cqw; height: .9cqw; border: .16cqw solid #c3c2b8; border-top: 0; border-radius: 0 0 1cqw 1cqw; }
  .redraw .rd-wave { display: flex; align-items: center; gap: .22cqw; }
  .redraw .rd-wave i { display: block; width: .18cqw; background: #f0efec; border-radius: 1px; }
  .redraw .rd-chev { color: #898782; font-size: 1.6cqw; }
  .redraw-label { display: inline-block; margin-left: .5rem; padding: .05rem .45rem; border: 1px solid var(--line); border-radius: 999px; font-size: .75rem; }
  a { color: var(--accent); }

  footer {
    border-top: 1px solid var(--line);
    padding: 1.25rem 0 2rem;
    color: var(--muted); font-size: .8rem;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>unbind</h1>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="zh" aria-pressed="false">中文</button>
  </div>
</header>

<main>
  <p class="intro" data-i18n="intro"></p>

  <section class="demo">
    <div class="shots">
      <figure class="shot-wrap">
        <div class="shot">
          <img src="screenshots/claude.png?v=2" alt="Claude greeting (cropped)"
               onerror="this.alt='screenshots/claude.png (missing)'">
          <div class="fade" aria-hidden="true"></div>
        </div>
        <figcaption>Claude · <span data-i18n="before"></span></figcaption>
      </figure>
      <figure class="redraw-wrap">
        <div class="redraw">
          <div class="rd-title" id="greeting" aria-live="polite">…</div>
          <div class="rd-box" aria-hidden="true">
            <div class="rd-ph" data-i18n="rd_placeholder"></div>
            <div class="rd-row">
              <span class="rd-plus">+</span>
              <span class="rd-pills"><span class="rd-pill on" data-i18n="rd_pill1"></span><span class="rd-pill" data-i18n="rd_pill2"></span></span>
              <span class="rd-right">
                <span data-i18n="rd_model"></span><span class="dim" data-i18n="rd_level"></span>
                <span class="rd-mic"></span>
                <span class="rd-wave"><i style="height:.7cqw"></i><i style="height:1.3cqw"></i><i style="height:1.8cqw"></i><i style="height:1.1cqw"></i><i style="height:.6cqw"></i></span>
                <span class="rd-chev">⌄</span>
              </span>
            </div>
          </div>
        </div>
        <figcaption>Claude · <span data-i18n="after"></span><span class="redraw-label" data-i18n="redraw_label"></span></figcaption>
        <p class="tag" id="tag" hidden></p>
        <div class="actions">
          <button type="button" id="again" data-i18n="again"></button>
          <button type="button" id="copy" class="secondary" data-i18n="copy"></button>
        </div>
        <div class="toast" id="toast"></div>
        <div class="kinds" id="kinds" role="group" aria-label="Kind"></div>
      </figure>
    </div>
  </section>

  <section>
    <h2 data-i18n="why_h"></h2>
    <p data-i18n="why_1"></p>
    <p data-i18n="why_2"></p>
    <p data-i18n="why_3"></p>
  </section>

  <section>
    <h2 data-i18n="submit_h"></h2>
    <p data-i18n="submit_p"></p>
    <p><a id="submit-link" href="#" target="_blank" rel="noopener" data-i18n="submit_link"></a></p>
  </section>
</main>

<footer>
  <p data-i18n="disclaimer"></p>
  <p><a id="repo-link" href="#" target="_blank" rel="noopener">GitHub</a> · MIT</p>
</footer>

<script>
  // Change this to the real repository URL after pushing.
  const REPO_URL = "https://github.com/xtoss/unbind";

  const I18N = {
    en: {
      intro: "Some products open with a greeting that puts coffee next to their own name. This page unties the two.",
      again: "Another one",
      copy: "Copy",
      copied: "Copied.",
      kind_all: "all",
      kind_absurd: "absurd",
      kind_hard: "hard unbind",
      kind_brand: "brand hedge",
      kind_literal: "literal",
      kind_formula: "formula",
      hard_tag: "hard unbind: something worth doing instead",
      brand_tag: "brand hedge: another name in the same slot",
      literal_tag: "literal: the sentence eats itself",
      formula_tag: "formula: someone else's slogan, same trick",
      before: "before",
      after: "after",
      rd_placeholder: "Type a message",
      rd_pill1: "Chat",
      rd_pill2: "Work",
      rd_model: "Default",
      rd_level: "Medium",
      redraw_label: "redrawn, not a screenshot",
      why_h: "Why",
      why_1: "Pairing a brand with a particular scene or mood is an old advertising trick.",
      why_2: "unbind does one simple thing: it keeps the sentence and swaps the word, so any binding that was put there on purpose can be undone.",
      why_3: "We live in a world built out of small psychological tricks, and most of them I let pass. This one I did not. With coffee and Claude on my side, I am taking the control back.",
      submit_h: "Add a pairing",
      submit_p: "Got a better absurd scenario? Submit it as a GitHub issue. No account beyond GitHub is needed.",
      submit_link: "Submit via GitHub Issue",
      disclaimer: "Unofficial. Not affiliated with, endorsed by, or sponsored by Anthropic, any brand named here, or any other company. In our own text, brand names appear only as plain words. The screenshots are cropped excerpts of each product's own interface, shown for comparison and commentary; the logos and interfaces in them belong to their respective owners.",
      load_error: "Could not load data/pairs.json. If you opened this file directly, serve it over HTTP instead."
    },
    zh: {
      intro: "有些产品的欢迎语会把咖啡和自己的名字放在一句话里。这个页面把它们分开。",
      again: "再来一个",
      copy: "复制",
      copied: "已复制。",
      kind_all: "全部",
      kind_absurd: "荒诞",
      kind_hard: "硬解绑",
      kind_brand: "品牌对冲",
      kind_literal: "原味",
      kind_formula: "套路",
      hard_tag: "硬解绑：本来该去做的事",
      brand_tag: "品牌对冲：同一个位置换个名字",
      literal_tag: "原味：句子自己咬自己",
      formula_tag: "套路：别家的口号，同一个把戏",
      before: "改前",
      after: "解绑后",
      rd_placeholder: "输入消息",
      rd_pill1: "对话",
      rd_pill2: "协作",
      rd_model: "默认",
      rd_level: "中",
      redraw_label: "重绘，非截图",
      why_h: "为什么",
      why_1: "把品牌和特定场景或情绪绑在一起，是广告业的老把戏。",
      why_2: "unbind 做的事很简单：句子留着，换掉那个词，让一切刻意设计的绑定解绑。",
      why_3: "我们生活在一个由无数心理小把戏搭起来的世界里，绝大多数我没有在意。这一个我在意了，在咖啡和 Claude 的加持下，我要把控制权拿回来。",
      submit_h: "投稿",
      submit_p: "有更荒诞的场景？通过 GitHub Issue 提交，除了 GitHub 账号不需要别的。",
      submit_link: "通过 GitHub Issue 投稿",
      disclaimer: "非官方项目。与 Anthropic、文中提到的任何品牌以及任何其他公司均无关联，未获其认可或赞助。我们自己写的内容里，品牌名只以纯文字出现。截图是各产品自身界面的局部节选，用于对比和评论，其中的 logo 和界面归各自所有者所有。",
      load_error: "无法加载 data/pairs.json。如果你是直接打开的文件，请用 HTTP 服务器访问。"
    }
  };

  let lang = "en";
  let data = null;
  let lastMood = null;
  const KINDS = ["absurd", "hard", "brand", "literal", "formula"];
  const FULL_SENTENCE = new Set(["formula"]); // pools whose entries are whole sentences, not a word for the brand's template
  let kind = "all";
  try { const k = localStorage.getItem("unbind.kind"); if (k === "all" || KINDS.includes(k)) kind = k; } catch (_) {}

  try {
    const saved = localStorage.getItem("unbind.lang");
    if (saved && I18N[saved]) lang = saved;
    else if (navigator.language && navigator.language.toLowerCase().startsWith("zh")) lang = "zh";
  } catch (_) {}

  const $ = (s) => document.querySelector(s);
  const greetingEl = $("#greeting");
  const tagEl = $("#tag");
  const kindsEl = $("#kinds");
  const toastEl = $("#toast");

  function applyI18n() {
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      el.textContent = I18N[lang][el.dataset.i18n] || "";
    });
    document.querySelectorAll(".lang button").forEach((b) => {
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    });
    kindsEl.replaceChildren(...["all", ...KINDS].map((k) => {
      const b = document.createElement("button");
      b.type = "button"; b.dataset.kind = k;
      b.textContent = I18N[lang]["kind_" + k];
      b.setAttribute("aria-pressed", String(k === kind));
      b.addEventListener("click", () => { kind = k; try { localStorage.setItem("unbind.kind", k); } catch (_) {} applyI18n(); render(); });
      return b;
    }));
    toastEl.textContent = "";
  }

  function pick(list) {
    if (list.length < 2) return list[0];
    let m;
    do { m = list[Math.floor(Math.random() * list.length)]; } while ((m.text ?? m) === lastMood);
    lastMood = m.text ?? m;
    return m;
  }

  // Weighted draw; weights are an optional field in data/pairs.json, set by hand by the maintainer.
  function pickWeighted(list) {
    if (list.length < 2) return list[0];
    const candidates = list.filter((e) => e.text !== lastMood);
    const total = candidates.reduce((n, e) => n + e.weight, 0);
    let r = Math.random() * total;
    for (const e of candidates) { r -= e.weight; if (r <= 0) { lastMood = e.text; return e; } }
    const e = candidates[candidates.length - 1]; lastMood = e.text; return e;
  }

  function render() {
    if (!data) return;
    const brandEntry = pick(data.brands);
    const brand = brandEntry.name;
    const active = kind === "all" ? KINDS : [kind];
    // Shared pools plus this brand's own entries (e.g. Claude → Shannon).
    const own = brandEntry.pools || {};
    const pool = active.flatMap((k) =>
      [...(data.pools[k]?.[lang] || []), ...(own[k]?.[lang] || [])].map((e) =>
        typeof e === "string" ? { text: e, weight: 1, k } : { text: e.text, weight: e.weight || 1, k }
      )
    );
    const entry = pickWeighted(pool);
    let mood = entry.text.replace("{brand}", brand);
    // Chinese template has no space before 和; add one when the mood ends in Latin text.
    if (lang === "zh" && !FULL_SENTENCE.has(entry.k) && /[A-Za-z0-9%]$/.test(mood)) mood += " ";
    const tagKey = entry.k + "_tag";
    tagEl.textContent = I18N[lang][tagKey] || "";
    tagEl.hidden = !I18N[lang][tagKey];
    const tpl = FULL_SENTENCE.has(entry.k) ? "{mood}" : (brandEntry.templates[lang] || brandEntry.templates.en);
    const [before, rest] = tpl.split("{mood}");
    const fill = (s) => s.replace("{brand}", brand);
    // English: the swapped word opens the sentence, so capitalize whichever piece comes first.
    const cap = (str) => str.replace(/^\s*[a-z]/, (c) => c.toUpperCase());
    const head = fill(before);
    const moodShown = (lang === "en" && head.trim() === "") ? cap(mood) : mood;
    const parts = () => [
      document.createTextNode(lang === "en" ? cap(head) : head),
      Object.assign(document.createElement("em"), { textContent: moodShown }),
      document.createTextNode(fill(rest))
    ];
    greetingEl.replaceChildren(...parts());
  }

  function setLang(next) {
    lang = next;
    try { localStorage.setItem("unbind.lang", lang); } catch (_) {}
    applyI18n();
    render();
  }

  document.querySelectorAll(".lang button").forEach((b) => {
    b.addEventListener("click", () => setLang(b.dataset.lang));
  });
  $("#again").addEventListener("click", render);
  $("#copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(greetingEl.textContent);
      toastEl.textContent = I18N[lang].copied;
      setTimeout(() => { toastEl.textContent = ""; }, 1500);
    } catch (_) {}
  });

  $("#repo-link").href = REPO_URL;
  $("#submit-link").href = REPO_URL + "/issues/new?template=submission.yml";

  applyI18n();
  // Always revalidate with the server so a word-list update shows up without a hard refresh.
  fetch("data/pairs.json", { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((d) => { data = d; render(); })
    .catch(() => { greetingEl.textContent = I18N[lang].load_error; greetingEl.style.fontSize = "2cqw"; greetingEl.style.whiteSpace = "normal"; });
</script>
</body>
</html>
