name: Submit a pairing
description: Suggest a line, or a new brand with its real greeting.
title: "[pairing] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: Anything goes. The maintainer picks what goes in.
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - en
        - zh
    validations:
      required: true
  - type: input
    id: brand
    attributes:
      label: Brand (optional)
      description: 'Leave empty for an existing brand. For a new brand, give its real greeting line and where you saw it.'
      placeholder: "Claude"
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      description: 'absurd (root canal) · hard = something worth doing instead (sleep) · brand = another brand in the slot (Tesla) · literal (Claude and Claude time?) · formula = the brand in a famous slogan, whole sentence (A Claude is forever)'
      options:
        - absurd
        - hard
        - brand
        - literal
        - formula
    validations:
      required: true
  - type: input
    id: line
    attributes:
      label: Your line
      description: 'Fills the blank in the brand''s greeting, e.g. "___ and Claude time?". Short lands harder; the original is just "Coffee".'
      placeholder: "root canal"
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Note (optional)
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: This is my own wording and I release it under the MIT license.
          required: true
